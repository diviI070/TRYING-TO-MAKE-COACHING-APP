<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tripathi's S. S. Classes — Preview</title>
<style>
  :root {
    --navy: #4A1113;
    --blue: #B91C1C;
    --sky: #FBEAEA;
    --ink: #241414;
    --muted: #7A6363;
    --line: #EFE2E2;
    --canvas: #FAF6F6;
    --white: #FFFFFF;
    --green: #15803D;
    --amber: #B45309;
    --red: #C2410C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #dfe6ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }
  .page-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 0;
  }
  .device {
    width: 390px;
    height: 844px;
    background: var(--canvas);
    border-radius: 44px;
    box-shadow: 0 20px 60px rgba(16,42,67,0.35);
    overflow: hidden;
    position: relative;
    border: 8px solid #0b0b0b;
    display: flex;
    flex-direction: column;
  }
  .status {
    height: 12px;
  }

  /* ---------- Generic RN-ish primitives ---------- */
  .view { display: flex; flex-direction: column; }
  .row { display: flex; flex-direction: row; }
  .text { font-size: 14px; color: var(--ink); }
  .pressable { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; border: none; background: none; padding: 0; text-align: left; font: inherit; }
  .scroll { overflow-y: auto; flex: 1; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ---------- Login screen ---------- */
  .login-safe { flex: 1; display: flex; flex-direction: column; background: var(--navy); }
  .login-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 38%; gap: 6px; }
  .logo { width: 62px; height: 62px; border-radius: 18px; background: var(--white); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; overflow: hidden; }
  .logo-image { width: 100%; height: 100%; object-fit: contain; }
  .logo-text { font-size: 36px; font-weight: 800; color: var(--navy); }
  .brand { color: var(--white); font-size: 24px; letter-spacing: 3px; font-weight: 800; }
  .brand-sub { color: #E8C3C3; font-size: 10px; letter-spacing: 2.3px; font-weight: 700; }
  .login-panel { flex: 1; background: var(--white); border-top-left-radius: 32px; border-top-right-radius: 32px; padding: 28px; display: flex; flex-direction: column; position: relative; }
  .login-title { font-size: 26px; font-weight: 800; color: var(--ink); margin: 0; }
  .login-copy { font-size: 14px; color: var(--muted); margin-top: 7px; margin-bottom: 30px; }
  .label { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; display: block; }
  .input { height: 52px; border-radius: 12px; border: 1px solid var(--line); padding: 0 14px; font-size: 15px; color: var(--ink); margin-bottom: 20px; background: #FCFDFE; width: 100%; outline: none; }
  .input:focus { border-color: var(--blue); }
  .primary-button { height: 54px; border-radius: 13px; background: var(--blue); display: flex; align-items: center; justify-content: center; margin-top: 6px; }
  .primary-text { color: var(--white); font-size: 16px; font-weight: 800; }
  .help { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  .version { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: #C79999; font-size: 11px; }

  /* ---------- App shell ---------- */
  .safe { flex: 1; display: flex; flex-direction: column; background: var(--canvas); min-height: 0; }
  .header { height: 104px; padding: 18px 20px 0; background: var(--navy); display: flex; flex-direction: row; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .header-eyebrow { color: #E3B4B4; font-size: 10px; letter-spacing: .8px; font-weight: 700; }
  .header-title { color: var(--white); font-weight: 800; font-size: 23px; margin-top: 4px; }
  .avatar { height: 42px; width: 42px; border-radius: 21px; background: #F5AE32; display: flex; align-items: center; justify-content: center; }
  .avatar-text { color: var(--navy); font-weight: 800; font-size: 13px; }
  .content { padding: 20px; padding-bottom: 100px; display: flex; flex-direction: column; gap: 16px; }

  .progress-card { background: var(--white); border-radius: 18px; padding: 18px; border: 1px solid #F1E4E4; }
  .progress-top { display: flex; flex-direction: row; justify-content: space-between; }
  .card-kicker { font-size: 10px; letter-spacing: .7px; color: var(--muted); font-weight: 700; }
  .progress-title { color: var(--ink); font-size: 17px; font-weight: 800; margin-top: 5px; }
  .percent { color: var(--blue); font-size: 25px; font-weight: 800; }
  .track { height: 8px; border-radius: 9px; background: #F6E5E5; margin-top: 18px; overflow: hidden; }
  .fill { height: 100%; border-radius: 9px; background: var(--blue); }
  .progress-caption { color: var(--muted); font-size: 12px; margin-top: 11px; }

  .section-title { display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin-top: 8px; }
  .section-heading { color: var(--ink); font-size: 18px; font-weight: 800; }
  .section-action { color: var(--blue); font-size: 13px; font-weight: 700; }

  .today-card { padding: 16px; border-radius: 16px; background: #FBEAEA; display: flex; flex-direction: row; align-items: center; gap: 13px; }
  .time-block { width: 42px; display: flex; flex-direction: column; align-items: center; }
  .time { color: var(--blue); font-size: 17px; font-weight: 800; }
  .meridiem { color: var(--blue); font-size: 10px; font-weight: 700; }
  .today-info { flex: 1; }
  .class-name { color: var(--ink); font-size: 14px; font-weight: 800; }
  .teacher { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .join { color: var(--blue); font-weight: 800; font-size: 13px; }

  .quick-grid { display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; }
  .quick { width: 48%; background: var(--white); padding: 15px; border-radius: 14px; border: 1px solid #F1E4E4; display: flex; flex-direction: column; gap: 10px; }
  .quick-icon { color: var(--blue); font-weight: 800; font-size: 21px; }
  .quick-label { color: var(--ink); font-size: 13px; font-weight: 700; }

  .update-card { background: var(--white); border-radius: 14px; padding: 15px; display: flex; flex-direction: row; align-items: center; border: 1px solid #F1E4E4; gap: 11px; }
  .notice-dot { width: 9px; height: 9px; background: #F5AE32; border-radius: 5px; flex-shrink: 0; }
  .update-text { flex: 1; }
  .update-title { color: var(--ink); font-weight: 700; font-size: 13px; }
  .update-body { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .chevron { color: var(--muted); font-size: 25px; }

  .page-intro { color: var(--muted); font-size: 14px; line-height: 20px; margin-bottom: 3px; }

  .class-card { display: flex; flex-direction: row; background: var(--white); padding: 15px; border-radius: 15px; border: 1px solid #F1E4E4; align-items: center; gap: 12px; }
  .subject-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .subject-icon-text { color: var(--ink); font-weight: 800; font-size: 20px; }
  .class-info { flex: 1; }
  .class-subject { color: var(--blue); font-weight: 700; font-size: 12px; }
  .class-topic { color: var(--ink); font-weight: 800; font-size: 14px; margin-top: 2px; }
  .class-meta { color: var(--muted); font-size: 11px; margin-top: 5px; }
  .class-status { font-size: 9px; color: var(--muted); font-weight: 800; }
  .status-live { color: var(--red); }

  .material-card { background: var(--white); padding: 14px; border-radius: 15px; border: 1px solid #F1E4E4; display: flex; flex-direction: row; align-items: center; gap: 12px; }
  .file-icon { width: 42px; height: 45px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .file-icon-text { color: var(--ink); font-size: 10px; font-weight: 800; }
  .material-info { flex: 1; }
  .material-title { font-weight: 800; font-size: 14px; color: var(--ink); }
  .material-meta { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .download { color: var(--blue); font-size: 22px; font-weight: 700; }

  .info-banner { background: #FFF1D7; padding: 14px; border-radius: 13px; }
  .info-banner-text { color: var(--amber); font-weight: 700; font-size: 13px; }
  .test-card { background: var(--white); padding: 17px; border-radius: 15px; border: 1px solid #F1E4E4; }
  .test-title { color: var(--ink); font-size: 16px; font-weight: 800; }
  .test-detail { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .test-bottom { display: flex; flex-direction: row; align-items: center; justify-content: space-between; margin-top: 16px; }
  .test-status { flex: 1; color: var(--amber); font-size: 11px; font-weight: 700; }
  .outline-button { border: 1px solid var(--blue); border-radius: 9px; padding: 8px 11px; }
  .outline-text { color: var(--blue); font-size: 12px; font-weight: 800; }
  .blue-button { background: var(--blue); }
  .blue-text { color: var(--white); }

  .rank-card { background: var(--navy); padding: 20px; border-radius: 17px; }
  .rank-kicker { color: #E3B4B4; font-size: 10px; letter-spacing: .8px; font-weight: 700; }
  .rank-number { color: var(--white); font-weight: 800; font-size: 30px; margin-top: 7px; }
  .rank-suffix { font-size: 14px; color: #E8C3C3; }
  .rank-copy { color: #E8C3C3; line-height: 18px; font-size: 12px; margin-top: 10px; }
  .result-card { background: var(--white); padding: 16px; border-radius: 15px; border: 1px solid #F1E4E4; }
  .result-top { display: flex; flex-direction: row; justify-content: space-between; }
  .result-title { font-weight: 800; color: var(--ink); font-size: 14px; }
  .result-percent { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .score { color: var(--ink); font-weight: 800; font-size: 14px; }
  .result-track { background: #F6E5E5; height: 7px; border-radius: 10px; margin-top: 15px; overflow: hidden; }
  .result-fill { height: 100%; border-radius: 10px; }

  .announcement { background: var(--white); padding: 17px; border-radius: 15px; border: 1px solid #F1E4E4; display: flex; flex-direction: column; gap: 8px; }
  .classroom-banner { width: 100%; height: 150px; border-radius: 16px; object-fit: cover; display: block; }
  .contact-card { background: var(--navy); padding: 18px; border-radius: 17px; display: flex; flex-direction: column; gap: 6px; }
  .contact-kicker { color: #F5AE32; font-size: 11px; letter-spacing: .8px; font-weight: 800; }
  .contact-address { color: var(--white); font-size: 13px; line-height: 19px; margin-top: 2px; }
  .contact-phones { color: #E8C3C3; font-size: 13px; font-weight: 700; margin-top: 4px; }
  .contact-note { color: #E8C3C3; font-size: 11px; margin-top: 6px; }
  .announce-head { display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
  .tag { color: var(--blue); font-weight: 800; font-size: 10px; letter-spacing: .5px; }
  .date { color: var(--muted); font-size: 11px; }
  .announce-title { color: var(--ink); font-weight: 800; font-size: 16px; }
  .announce-body { color: var(--muted); font-size: 13px; line-height: 19px; }

  .nav { height: 70px; padding: 0 14px; background: var(--white); border-top: 1px solid var(--line); display: flex; flex-direction: row; justify-content: space-around; align-items: center; flex-shrink: 0; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 55px; }
  .nav-icon { color: #A98787; font-size: 18px; font-weight: 800; }
  .nav-label { color: #A98787; font-size: 10px; font-weight: 700; }
  .nav-active { color: var(--blue) !important; }

  .hint { text-align: center; color: #6B7C93; font-size: 12px; margin-top: 14px; max-width: 390px; }
</style>
</head>
<body>
<div class="page-wrap">
  <div>
    <div class="device" id="device"></div>
    <div class="hint">Preview of App.tsx — tap around like you would on a phone.</div>
  </div>
</div>

function el(tag, className, children, attrs) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'onclick') node.addEventListener('click', v);
    else if (k === 'oninput') node.addEventListener('input', v);
    else node.setAttribute(k, v);
  });
  (children || []).forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}
const text = (className, str) => el('span', className, [str]);

}

  panel.appendChild(text('login-copy', 'Sign in to continue your Chemistry preparation.'));

  panel.appendChild(el('label', 'label', ['Student ID']));
  const idInput = el('input', 'input', null, { placeholder: 'Enter student ID' });
  idInput.value = state.studentId;
  idInput.addEventListener('input', e => state.studentId = e.target.value);
  panel.appendChild(idInput);

  wrap.appendChild(panel);
  return wrap;

      text('nav-icon' + (active ? ' nav-active' : ''), icon),
      text('nav-label' + (active ? ' nav-active' : ''), label),
    ], { onclick: () => goto(key) }));
  });
  return nav;
}

render();
</script>
</body>
</html>
